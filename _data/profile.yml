short_bio: >-
  <p>
    I am a doctoral student in Surgery at Peking University. My clinical and research interests center on orthopaedic conditions, especially osteoarthritis, femoral head osteonecrosis, and anterior cruciate ligament injuries.
  </p>
  <p>
    My research explores hydrogel and hydrogel microsphere engineering for tissue-engineering approaches to osteoarthritis, cartilage defects, and bone defects. Related topics in my publications include macrophage regulation, oxidative stress, inflammation, and biomaterial-based repair.
  </p>
  <p>
    My clinical training includes foundational techniques in common joint surgery and the diagnosis and treatment of common orthopaedic conditions. I hold a medical qualification certificate and a medical practitioner license in China.
  </p>
  <p>
    <strong>Laboratory techniques:</strong> Western blotting, PCR, immunofluorescence, flow cytometry, co-immunoprecipitation, cell transfection, animal modeling, and in vivo imaging.<br/>
    <strong>Research methods:</strong> meta-analysis, NHANES data analysis, network pharmacology, and molecular docking.<br/>
    <strong>Software:</strong> Adobe Illustrator, GraphPad Prism, and ImageJ. <strong>English:</strong> CET-4 (587), CET-6 (486).
  </p>

