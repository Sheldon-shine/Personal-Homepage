short_bio: >-
  <p>
    I am pursuing a doctoral degree in surgery at Peking University. My clinical and research work mainly focuses on common orthopedic diseases, with particular attention to osteoarthritis, avascular necrosis of the femoral head, and anterior cruciate ligament injuries.
  </p>
  <p>
    In terms of research, I mainly conduct studies on the modification and application of bioactive materials, exploring the application of tissue engineering strategies in the treatment of osteoarthritis, cartilage defects, and bone defects repair. The related research also involves macrophage regulation, oxidative stress, inflammatory response, and biological material repair.
  </p>
  <p>
    Clinically, I am proficient in basic skills of conventional joint surgeries, possess the ability to diagnose and treat common orthopedic diseases, and have obtained the physician qualification certificate and physician practice certificate.
  </p>

